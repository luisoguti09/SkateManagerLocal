<mat-card class="qr-card"><mat-card-content>
 <div class="qr-box" *ngIf="qrUrl && !loading"><img [src]="qrUrl" alt="QR de credencial" /></div>
 <div class="loader" *ngIf="loading" role="status" aria-label="Cargando tu QR"><mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner></div>
 <div class="error" *ngIf="error" role="alert"><p>{{error}}</p><button mat-stroked-button (click)="reintentar()">Reintentar</button></div>
 </mat-card-content><div class="actions"><button mat-stroked-button (click)="descargar()" [disabled]="!qrUrl || loading"><mat-icon>download</mat-icon> Descargar</button></div></mat-card>
