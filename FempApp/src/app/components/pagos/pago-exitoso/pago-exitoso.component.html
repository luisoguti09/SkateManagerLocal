<div class="wrap">
  <h2>{{ validado ? 'Pago acreditado' : 'Verificación del pago' }}</h2>
  <p *ngIf="cargando" role="status">Consultando el estado del pago…</p>
  <p *ngIf="error" role="alert">{{ error }}</p>
  <p *ngIf="!cargando && !error && !validado">
    El pago todavía no figura conciliado. Estado informado: {{ estado }}.
  </p>
  <button mat-stroked-button (click)="verificar()" [disabled]="cargando">
    Actualizar estado</button
  ><button mat-stroked-button (click)="volver()">Volver a mis eventos</button>
</div>
