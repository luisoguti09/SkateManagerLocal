<mat-card class="asistencia-card">
 <div class="cabecera"><mat-card-title>Registrar mi asistencia</mat-card-title><button mat-stroked-button (click)="volver()"><mat-icon>arrow_back</mat-icon> Volver</button></div>
 <mat-card-content>
  <h2 *ngIf="nombreEvento">{{nombreEvento}}</h2>
  <p *ngIf="verificando" role="status">Verificando tu inscripción y el pago…</p>
  <section *ngIf="motivo && !verificando" role="status"><p>{{motivo}}</p><button mat-stroked-button *ngIf="eventoId" (click)="verificarHabilitacion()">Volver a verificar</button></section>
  <section *ngIf="completado" role="status"><h2>¡Listo!</h2><p>{{confirmacion}}</p></section>
  <ng-container *ngIf="autorizado && !completado && !verificando">
   <p>Escaneá el QR de este evento. Registramos una asistencia, aunque participes con varios perfiles.</p>
   <mat-slide-toggle [(ngModel)]="mute">Silenciar sonidos</mat-slide-toggle>
   <p *ngIf="errorCamara" role="alert">{{errorCamara}} <button mat-button (click)="verificarHabilitacion()">Reintentar</button></p>
   <div class="scanner"><zxing-scanner [autostart]="true" [enable]="!busy" [tryHarder]="true" [formats]="allowedFormats" [device]="currentDevice" (camerasFound)="onCamerasFound($event)" (scanSuccess)="onScanSuccess($event)" (scanError)="falloCamara()" (permissionResponse)="$event === false && falloCamara()"></zxing-scanner></div>
   <p *ngIf="busy" role="status">Guardando tu asistencia…</p>
   <button mat-stroked-button (click)="switchCamera()" [disabled]="devices.length < 2 || busy">Cambiar cámara</button>
  </ng-container>
 </mat-card-content>
</mat-card>
