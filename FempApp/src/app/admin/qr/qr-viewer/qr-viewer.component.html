<div class="card">
  <h2>QR de credencial</h2>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>ID de usuario</mat-label>
      <input matInput type="number" [(ngModel)]="uid">
    </mat-form-field>
    <button mat-stroked-button (click)="ver()">Ver PNG</button>
  </div>

  <div class="preview" *ngIf="imgUrl; else empty">
    <img [src]="imgUrl" alt="QR">
  </div>
  <ng-template #empty>
    <p class="muted">Ingresá un ID y presioná “Ver PNG”.</p>
  </ng-template>
</div>
