<app-back-bar title="Eventos"></app-back-bar>

<div class="card">
  <div class="header">
    <button mat-flat-button color="primary" (click)="nuevo()">
      <mat-icon>add</mat-icon> Nuevo evento
    </button>
  </div>



  <section class="evento-resumen" *ngIf="seleccionado as evento" aria-label="Detalle del evento">
    <div class="resumen-cabecera">
      <h2>{{ evento.nombre || evento.titulo || 'Sin nombre' }}</h2>

      <button type="button" class="cerrar-resumen" (click)="seleccionado = null">
        Cerrar detalle
      </button>
    </div>

    <app-circuito-evento [eventoId]="evento.id"></app-circuito-evento>
  </section>

  <app-eventos-agrupados [eventos]="data" [plantilla]="tabla"></app-eventos-agrupados>
  <ng-template #tabla let-filas>
  <table mat-table [dataSource]="filas" class="mat-elevation-z8">

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let e">
        <button type="button" class="nombre-evento" (click)="seleccionado = e">
          {{ e.nombre || e.titulo || 'Sin nombre' }}
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let e">
        {{ e.fechaMostrable ? (e.fechaMostrable | date:'mediumDate') : '—' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let e">
        {{ e.precio != null ? ('$ ' + e.precio) : '—' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let e">
        <button mat-stroked-button (click)="seleccionado = e">
          <mat-icon>visibility</mat-icon>
          Ver detalle
        </button>
        <button mat-stroked-button (click)="editar(e.id)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-stroked-button (click)="verQr(e.id)">
          <mat-icon>qr_code_2</mat-icon> QR
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayed"></tr>
    <tr mat-row *matRowDef="let row; columns: displayed"></tr>
  </table>
  </ng-template>
</div>
