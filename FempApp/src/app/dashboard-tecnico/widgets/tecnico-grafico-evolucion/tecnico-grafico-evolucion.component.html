<div class="grafico-card">
    <div class="grafico-card__header">
        <h2>Evolución mensual</h2>
        <p>Seguimiento técnico en base a evaluaciones reales.</p>
    </div>

    <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [dataLabels]="chartOptions.dataLabels"
        [stroke]="chartOptions.stroke" [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
        [grid]="chartOptions.grid" [tooltip]="chartOptions.tooltip" [legend]="chartOptions.legend">
    </apx-chart>
</div>
