<section class="dashboard-tecnico">
    <div class="dashboard-header">
        <h1>Dashboard técnico</h1>
        <p>Resumen general del seguimiento técnico y evolución deportiva.</p>
    </div>

    @if (loading) {
    <div class="dashboard-state">
        Cargando dashboard técnico...
    </div>
    }

    @if (error) {
    <div class="dashboard-state dashboard-state--error">
        Ocurrió un error al cargar la información.
    </div>
    }

    @if (!loading && !error && dashboardData; as data) {
    <app-tecnico-resumen-cards [resumen]="data.resumen"></app-tecnico-resumen-cards>

    <app-tecnico-accesos-rapidos></app-tecnico-accesos-rapidos>

    <app-tecnico-ultimos-seguimientos [items]="data.ultimosSeguimientos">
    </app-tecnico-ultimos-seguimientos>
    }
</section>
